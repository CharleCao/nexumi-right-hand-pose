[project]
name = "nexumi-right-hand-pose"
version = "0.1.0"
description = "Right-hand colored polyhedron pose estimation from calibrated fisheye stereo video"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
vision = [
    "av>=14.0",
    "opencv-python-headless>=4.10",
    "pyyaml>=6.0",
    "scipy>=1.14",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nexumi-build-marker = "nexumi_marker_pose.build_marker_model:main"
nexumi-render-marker = "nexumi_marker_pose.render_marker_views:main"
nexumi-estimate-pose = "nexumi_marker_pose.inspect_pose:main"
nexumi-track-sequence = "nexumi_marker_pose.track_sequence:main"
nexumi-view-trajectories = "nexumi_marker_pose.trajectory_viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexumi_marker_pose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
